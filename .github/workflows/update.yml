name: Stromdaten aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 Minuten
  workflow_dispatch:          # zusätzlich per Knopfdruck startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daten von Energy-Charts holen
        run: |
          curl -sf "https://api.energy-charts.info/signal?country=de" -o signal.json

      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signal.json
          git diff --cached --quiet || git commit -m "Stromdaten aktualisiert"
          git push
