name: Stromdaten aktualisieren

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daten von Energy-Charts holen
        run: |
          curl -sf "https://api.energy-charts.info/signal?country=de" -o signal.json
          curl -sf "https://api.energy-charts.info/public_power?country=de" -o public_power.json || true

      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signal.json
          if [ -s public_power.json ]; then git add public_power.json; fi
          git diff --cached --quiet || git commit -m "Stromdaten aktualisiert"
          git push
